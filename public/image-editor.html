<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이미지 수정 위치 선택</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#0b1220;color:#f4f7fb;font:15px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif;margin:0;padding:18px}
main{max-width:760px;margin:auto}.hint{color:#aab9cb}.panel{border:1px solid #304058;background:#141f30;border-radius:14px;padding:14px;margin-top:12px}h1{font-size:20px;margin:6px 0}
.viewport{overflow:auto;background:#0a0f1a;max-height:70vh;border-radius:9px;touch-action:pan-y}
.image-stage{position:relative;width:100%;min-height:220px;max-width:100%;margin:auto}#sourceImage{display:block;width:100%;height:auto;max-height:none;object-fit:contain}canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
[hidden]{display:none!important}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
label{display:block;color:#cad7e8;font-size:13px}select{background:#0a1220;color:#fff;border:1px solid #456077;border-radius:8px;padding:10px;width:100%;font:inherit}input{background:#0a1220;color:#fff;border:1px solid #456077;border-radius:8px;padding:10px;width:100%;font:inherit}
button{border:0;border-radius:10px;padding:12px 14px;font:inherit;font-weight:650;background:#2d71e8;color:white;cursor:pointer;width:100%}
button:disabled{opacity:.45;cursor:default}.secondary{background:#33445c}.msg{min-height:24px;color:#d1e1ff;margin-top:12px}
#submit{white-space:normal;overflow-wrap:anywhere;line-height:1.4;min-height:52px}
.progress-panel{margin-top:14px;padding:12px;border:1px solid #304058;border-radius:10px;background:#0d1728}
.progress-top{display:flex;justify-content:space-between;gap:12px;color:#e3edfc;font-size:14px;margin-bottom:10px}
.progress-track{height:10px;border-radius:99px;overflow:hidden;background:#29374f}
.progress-fill{width:0%;height:100%;background:#4b91f5;border-radius:99px;transition:width .4s ease}
.progress-details{font-size:13px;color:#aabbd0;margin-top:9px}
.progress-details span+span:before{content:" · "}

</style></head>
<body><main><h1>수정할 글자 위치 선택</h1><p class="hint">바꿀 글자 위치를 <strong>한 번 누르거나 드래그</strong>해 줘. 선택 영역을 확인한 뒤 전송할 수 있어.</p>
<div class="panel"><div class="viewport"><div class="image-stage"><img id="sourceImage" alt="원본 이미지"/><canvas id="image"></canvas></div></div><a id="sourceFileLink" style="display:block;margin:9px 0;color:#a9c7f6;font-size:13px" target="_blank" rel="noopener">원본 이미지 직접 보기</a><div class="fields">
<label>기존 문구<input id="before" readonly></label>
<label>변경할 문구<input id="after" maxlength="70"></label>
</div><label>글자 기울기 (°)<input id="angle" type="number" min="-60" max="60" step="1" value="0"></label>
<p class="hint" id="selection">글자 부분을 탭하거나 드래그하여 선택해 줘.</p>
<button id="submit" disabled>선택한 영역 수정 후 텔레그램으로 보내기</button><button id="clear" class="secondary" style="margin-top:8px">선택 다시 하기</button>
<div id="progressPanel" class="progress-panel" hidden aria-live="polite">
<div class="progress-top"><strong id="progressLabel">준비 중</strong><strong id="progressPercent">0%</strong></div>
<div class="progress-track" role="progressbar" aria-label="편집 진행 단계" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
<div class="progress-details"><span id="progressElapsed">경과 0초</span><span id="progressEta">예상 대기시간 계산 중</span></div><div class="progress-details" id="progressHint">실제 진행 단계와 소요 기록을 기반으로 추정해요.</div>
</div>
<div role="status" class="msg" id="status"></div></div>
</main><script>
(async()=>{
const q=new URLSearchParams(location.search),job=q.get('job');
const canvas=document.getElementById('image'),ctx=canvas.getContext('2d');
const sub=document.getElementById('submit'),status=document.getElementById('status'),sel=document.getElementById('selection');
const before=document.getElementById('before'),after=document.getElementById('after');
let rect=null,start=null,active=false;const image=document.getElementById('sourceImage');
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);
 if(rect){ctx.fillStyle='rgba(239,54,64,.13)';ctx.fillRect(rect.x,rect.y,rect.w,rect.h);ctx.strokeStyle='#ff3b45';ctx.lineWidth=Math.max(2,canvas.width/230);ctx.strokeRect(rect.x,rect.y,rect.w,rect.h);}
}
function point(e){const b=image.getBoundingClientRect();return{x:Math.max(0,Math.min(image.naturalWidth,(e.clientX-b.left)*image.naturalWidth/b.width)),y:Math.max(0,Math.min(image.naturalHeight,(e.clientY-b.top)*image.naturalHeight/b.height))}}
function selection(a,b){return{x:Math.round(Math.min(a.x,b.x)),y:Math.round(Math.min(a.y,b.y)),w:Math.round(Math.abs(a.x-b.x)),h:Math.round(Math.abs(a.y-b.y))}}
function fitLongerReplacement(box){
 const oldLength=Array.from(before.value).length;
 const newLength=Array.from(after.value).length;
 if(newLength<=oldLength||!box||box.w<4||box.h<4)return box;
 const needed=Math.ceil(newLength*box.h*.49);
 // Keep the left edge fixed and grow right only if the image contains room.
 return {...box,w:Math.min(canvas.width-box.x,Math.max(box.w,needed))};
}
function editTapRect(p){
 // A tap identifies the center of the word. Give it an editable area that
 // is large enough to be useful without selecting the entire image.
 const W=canvas.width,H=canvas.height;
 const chars=Math.max(1,Array.from(after.value||before.value).length);
 const height=Math.min(H,Math.max(24,Math.min(85,Math.round(H*.065))));
 const width=Math.min(W,Math.max(55,Math.min(W*.7,Math.ceil(chars*height*.57)+20)));
 return {x:Math.max(0,Math.min(W-width,Math.round(p.x-width/2))),
   y:Math.max(0,Math.min(H-height,Math.round(p.y-height/2))),
   w:Math.round(width),h:Math.round(height)};
}
function commitSelection(endPoint){
 if(!start)return;
 let selected=selection(start,endPoint);
 const small=selected.w<5||selected.h<5;
 rect=small?editTapRect(endPoint):fitLongerReplacement(selected);
 // The character-count width estimate is unreliable across Hangul, digits,
 // proportional fonts and perspective. Let the image editor fit the text,
 // and let output boundary QA reject actual clipping instead.
 sub.disabled=rect.w<4||rect.h<4;
 sel.textContent=sub.disabled?'영역을 조금 더 크게 선택해 줘.':
   '위치가 선택됐어. 새 문구가 길어도 그대로 전송할 수 있어.';
 status.textContent=sub.disabled?'선택 영역을 확인해 줘.':
   '선택 완료 · '+rect.w+'×'+rect.h+'px · 전송 가능';
 active=false;start=null;draw();
}
function beginSelection(p){
 if(!image.complete||!image.naturalWidth){
   status.textContent='원본 이미지 로딩이 끝나지 않았어.';return;
 }
 start=p;active=true;rect=null;sub.disabled=true;
 status.textContent='영역 선택 중이야.';
}
canvas.addEventListener('pointerdown',e=>{
 if(e.button!==undefined&&e.button!==0)return;
 e.preventDefault();beginSelection(point(e));
 if(active)try{canvas.setPointerCapture(e.pointerId)}catch{}
});
canvas.addEventListener('pointermove',e=>{
 if(!active)return;
 e.preventDefault();rect=selection(start,point(e));draw();
});
canvas.addEventListener('pointerup',e=>{
 if(!active)return;
 e.preventDefault();commitSelection(point(e));
});
canvas.addEventListener('pointercancel',e=>{
 if(!active)return;
 e.preventDefault();commitSelection(point(e));
});
// Legacy embedded browsers can lack PointerEvent; use dedicated touch and
// mouse handling only there to avoid processing each interaction twice.
if(!('PointerEvent' in window)){
 let lastTouchAt=0;
 const touchPoint=t=>point({clientX:t.clientX,clientY:t.clientY});
 canvas.addEventListener('touchstart',e=>{
   if(!e.touches.length)return;e.preventDefault();lastTouchAt=Date.now();
   beginSelection(touchPoint(e.touches[0]));
 },{passive:false});
 canvas.addEventListener('touchmove',e=>{
   if(!active||!e.touches.length)return;e.preventDefault();
   rect=selection(start,touchPoint(e.touches[0]));draw();
 },{passive:false});
 canvas.addEventListener('touchend',e=>{
   if(!active)return;e.preventDefault();
   commitSelection(e.changedTouches.length?touchPoint(e.changedTouches[0]):start);
 },{passive:false});
 canvas.addEventListener('mousedown',e=>{
   if(Date.now()-lastTouchAt<700)return;
   if(e.button!==0)return;beginSelection(point(e));
 });
 canvas.addEventListener('mousemove',e=>{
   if(!active||Date.now()-lastTouchAt<700)return;
   rect=selection(start,point(e));draw();
 });
 canvas.addEventListener('mouseup',e=>{
   if(!active||Date.now()-lastTouchAt<700)return;
   commitSelection(point(e));
 });
}
document.getElementById('clear').addEventListener('click',()=>{
 active=false;start=null;rect=null;sub.disabled=true;
 sel.textContent='글자 위를 한 번 누르거나 드래그해 선택해 줘.';
 status.textContent='선택 초기화 완료';draw();
});
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const panel=document.getElementById('progressPanel');
const progressFill=document.getElementById('progressFill');
const progressLabel=document.getElementById('progressLabel');
const progressPercent=document.getElementById('progressPercent');
const progressElapsed=document.getElementById('progressElapsed');
const progressHint=document.getElementById('progressHint');
const progressEta=document.getElementById('progressEta');
const progressTrack=document.getElementById('progressTrack');
const renderProgress=(data)=>{
 panel.hidden=false;
 const pct=Math.max(0,Math.min(100,Number(data.progress)||0));
 progressFill.style.width=pct+'%';
 progressLabel.textContent=data.message||'처리 중';
 progressPercent.textContent=pct+'%';
 progressElapsed.textContent='경과 '+(Number(data.elapsedSeconds)||0)+'초';
 progressTrack.setAttribute('aria-valuenow',String(pct));
 const fmt=sec=>sec>=60?Math.floor(sec/60)+'분'+(sec%60?' '+sec%60+'초':''):sec+'초';
 if(pct===100){progressEta.textContent='남은 시간 0초';progressHint.textContent='텔레그램에서 결과를 확인해 줘.';}
 else if(data.etaBasis==='overdue'){progressEta.textContent='예상 범위 초과';progressHint.textContent='AI 편집이 계속 진행 중이야. 완료되면 텔레그램으로 전송돼.';}
 else if(data.etaMinSeconds!=null&&data.etaMaxSeconds!=null){
   progressEta.textContent='예상 남은 시간 '+fmt(data.etaMinSeconds)+' ~ '+fmt(data.etaMaxSeconds);
   progressHint.textContent=data.etaBasis==='history'?'최근 완료 작업의 소요 시간 기준':'초기 추정 범위 · 실제 소요 시간은 달라질 수 있어.';
 }else{progressEta.textContent='처리 대기 중';progressHint.textContent='작업 단계를 확인하고 있어.';}
};
async function loadJobStatus(){
 const response=await fetch('/api/image-job/'+encodeURIComponent(job)+'/status',{cache:'no-store'});
 if(response.status===404)throw Error('편집 작업을 찾지 못했어. 서버 재시작으로 작업이 초기화됐을 수 있어. 기존 링크를 다시 열어도 복원되지 않으면 새 이미지를 올려 줘.');
 if(!response.ok)throw Error('작업 상태 조회 실패 ('+response.status+')');
 return response.json();
}
function showJobStatus(data){
 renderProgress(data);
 if(data.state==='done'){
  status.textContent='수정 완료! 텔레그램에서 이미지를 확인해 줘.';
  return true;
 }
 if(data.state==='failed'||data.state==='interrupted')throw Error(data.error||'편집이 중단됐어. 새 작업을 만들어 줘.');
 status.textContent=data.state==='ready'
  ?'편집 요청이 아직 접수되지 않았어. 다시 전송해 줘.'
  :'편집 진행 중이야. 화면 연결이 끊겨도 서버가 작업을 계속해.';
 return false;
}
// Transient HTTP and browser connection errors do not mean an accepted edit failed.
const inProgressStates=new Set(['reserving','preparing','editing','verifying','sending']);
const transientStatusError=e=>/fetch|network|Load failed|상태 조회 실패.*5[0-9][0-9]|Failed to fetch|connection|timeout/i.test(String(e?.message||''));
async function statusPoll({uncertainSubmission=false}={}){
 let connectionErrors=0,notFound=0;
 // Keep the existing bounded poll time and 30-minute server job TTL.
 for(let i=0;i<180;i++){
  await sleep(2000);
  let data;
  try{
   data=await loadJobStatus();
  }catch(e){
   if(/편집 작업을 찾지 못했어/.test(e.message||'')){
    // A 404 after an accepted edit indicates a lost server job, not a
    // request to resubmit blindly. Confirm it before showing a terminal state.
    notFound++;
    if(notFound>=3)throw Error('작업 정보가 서버에서 사라졌어. 서버가 재시작됐을 수 있어. 텔레그램에서 결과를 확인한 뒤 새 작업을 시작해 줘.');
   }else if(transientStatusError(e)){
    connectionErrors++;
    if(connectionErrors>=30)throw Error('상태 확인 연결이 오래 지연되고 있어. 중복 편집하지 말고 텔레그램의 완료/실패 메시지를 확인해 줘.');
   }else throw e;
   status.textContent='서버 연결을 다시 확인하고 있어. 중복 편집은 전송하지 않아.';
   continue;
  }
  connectionErrors=0;notFound=0;
  if(uncertainSubmission&&data.state==='ready'){
   // A lost POST is not an accepted edit. Keep polling for a short
   // reconciliation window instead of making another POST automatically.
   if(i>=14)throw Error('편집 요청이 서버에 접수됐는지 확인되지 않았어. 중복 요청하지 말고 텔레그램 메시지를 확인해 줘.');
   status.textContent='접수 여부를 확인 중이야. 같은 요청은 다시 전송하지 않아.';
   continue;
  }
  if(data.state==='ready'&&!uncertainSubmission){
   throw Error('접수 완료 응답 이후 작업이 대기 상태로 돌아갔어. 중복 요청하지 말고 텔레그램 안내를 확인해 줘.');
  }
  if(showJobStatus(data))return;
 }
 throw Error('상태 확인 시간이 초과됐어. 중복 편집하지 말고 텔레그램에서 결과를 확인해 줘.');
}
sub.addEventListener('click',async()=>{
 if(!rect)return;
 sub.disabled=true;
 renderProgress({progress:5,message:'편집 요청 접수 중',elapsedSeconds:0});
 status.textContent='편집 요청을 접수하고 있어.';
 try{
  let response;
  try{
   response=await fetch('/api/image-job/'+encodeURIComponent(job)+'/apply',{
    method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({...rect,after:after.value,angle:Number(document.getElementById('angle').value)})
   });
  }catch(error){
   // A failed browser POST gives no proof of server rejection.
   // Never repeat a paid edit automatically or enable duplicate submission.
   status.textContent='접수 응답이 끊겼어. 서버 작업 상태를 확인 중이야.';
   await statusPoll({uncertainSubmission:true});
   return;
  }
  let payload={};
  try{payload=await response.json()}catch{}
  if(!response.ok){
   if([502,503,504].includes(response.status)){
    status.textContent='서버 연결이 불안정해 접수 여부를 확인 중이야.';
    await statusPoll({uncertainSubmission:true});
    return;
   }
   if(payload.code==='TEXT_REGION_TOO_NARROW'){
    rect=null;draw();sel.textContent='글자가 잘리지 않도록 좌우 여백을 포함해 새 영역을 선택해 줘.';
   }
   throw Error(payload.error||'편집 요청이 거절됐어 ('+response.status+').');
  }
  if(payload.state==='done'){renderProgress({progress:100,message:'완료',elapsedSeconds:0});status.textContent='완료! 텔레그램을 확인해 줘.';return;}
  if(response.status!==202&&!inProgressStates.has(payload.state)){
   throw Error('예상하지 못한 접수 응답이야. 중복 전송하지 말고 텔레그램 상태를 확인해 줘.');
  }
  renderProgress({progress:15,message:'접수 완료 · 이미지 준비 중',elapsedSeconds:0});
  status.textContent='편집 요청 접수 완료. 진행 상태를 확인 중이야.';
  await statusPoll();
 }catch(error){
  status.textContent='안내: '+error.message;
  // Only explicitly rejected requests may be retried by the operator.
  // For unknown/accepted work, never enable a duplicate charge/edit.
  sub.disabled=!(/편집 요청이 거절됐어|Unexpected replacement value|Invalid edit selection|글자가 잘리지 않도록/.test(error.message));
 }
});
try{
 if(!/^[0-9a-f]{32}$/.test(job||''))throw Error('링크가 올바르지 않아.');
 const r=await fetch('/api/image-job/'+job+'/info');if(r.status===404)throw Error('편집 작업을 찾지 못했어. 서버 재시작으로 작업이 초기화됐을 수 있어. 봇에서 새 편집 링크를 발급해 줘.');
 if(!r.ok)throw Error('편집 서버 연결에 문제가 있어 ('+r.status+'). 잠시 후 다시 열어 줘.');
 const info=await r.json();before.value=info.before;after.value=info.after;
 const sourcePath='/api/image-job/'+encodeURIComponent(job)+'/original';
 document.getElementById('sourceFileLink').href=sourcePath;
 const stage=document.querySelector('.image-stage');
 const ready=()=> {
   if(!image.naturalWidth||!image.naturalHeight){status.textContent='원본 이미지 크기를 읽을 수 없어. 원본 이미지 직접 보기에서 확인해 줘.';return;}
   canvas.width=image.naturalWidth;
   canvas.height=image.naturalHeight;
   stage.style.minHeight='0';
   const container=document.querySelector('.viewport');
   const available=Math.max(200,Math.min(720,container.clientWidth||720));
   stage.style.width=Math.min(available,image.naturalWidth)+'px';
   rect=null;
   sub.disabled=true;
   status.textContent='원본 이미지를 불러왔어. 글자 위를 한 번 누르거나 드래그해 줘.';
   draw();
 };
 image.onload=ready;
 image.onerror=()=>{stage.style.minHeight='120px';status.textContent='원본 이미지를 불러오지 못했어. 원본 이미지 직접 보기에서 확인해 줘.';};
 image.src=info.preview||sourcePath;
 if(image.complete && image.naturalWidth)ready();
}catch(e){status.textContent=e.message;}
})();
</script></body></html>
